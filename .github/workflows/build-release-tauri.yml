name: Build & Release (Tauri)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: 'Tauri Linux (amd64)'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            icnsutils \
            graphicsmagick \
            rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build & Package
        run: bash scripts/build-desktop-tauri.sh linux --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tauri-linux-amd64
          path: |
            apps/desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop-tauri/src-tauri/target/release/bundle/rpm/*.rpm

  build-windows:
    name: 'Tauri Windows (amd64)'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build & Package
        run: bash scripts/build-desktop-tauri.sh win --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tauri-windows-amd64
          path: |
            apps/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop-tauri/src-tauri/target/release/bundle/msi/*.msi

  build-mac-amd64:
    name: 'Tauri macOS (amd64)'
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build & Package
        run: bash scripts/build-desktop-tauri.sh mac x64 --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tauri-mac-amd64
          path: |
            apps/desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg

  build-mac-arm64:
    name: 'Tauri macOS (arm64)'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build & Package
        run: bash scripts/build-desktop-tauri.sh mac arm64 --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tauri-mac-arm64
          path: |
            apps/desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    name: Create Tauri Release
    needs:
      - build-linux
      - build-windows
      - build-mac-amd64
      - build-mac-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v6

      - name: Generate release notes
        run: python3 scripts/generate-release-notes.py "${{ github.ref_name }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} (Tauri)
          body_path: release-notes.md
          files: |
            tauri-linux-amd64/*.AppImage
            tauri-linux-amd64/*.deb
            tauri-linux-amd64/*.rpm
            tauri-windows-amd64/*.exe
            tauri-windows-amd64/*.msi
            tauri-mac-amd64/*.dmg
            tauri-mac-arm64/*.dmg
          draft: true
          prerelease: false
