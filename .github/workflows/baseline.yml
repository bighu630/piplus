name: Baseline

# 服务端兜底：本地 hook 只在本地 git 操作时触发，GitHub 侧合并/直推 main 不会触发它们。
# 本地与 CI 跑的是同一个 scripts/baseline-check.sh，保证基线定义唯一。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    name: baseline (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 不能用 --frozen-lockfile：bun.lock 被 .gitignore 忽略，未入库
      - name: Install dependencies
        run: bun install

      - name: Run baseline check
        run: bash scripts/baseline-check.sh
        env:
          # 每次 CI 都实跑，避免残留缓存文件导致误跳过
          BASELINE_NO_CACHE: "1"
