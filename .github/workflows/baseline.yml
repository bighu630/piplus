name: Baseline

# 服务端兜底：本地 hook 只在本地 git 操作时触发，GitHub 侧合并/直推 main 不会触发它们。
# 本地与 CI 跑的是同一个 scripts/baseline-check.sh，保证基线定义唯一。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    name: baseline (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun.lock 已纳入版本控制，因此这里用冻结模式：lockfile 与 package.json 不一致时
      # 安装直接失败，而不是静默解析出一套新依赖（依赖漂移在 CI 里最难排查）。
      # 更新依赖后必须同步提交 bun.lock，否则本工作流会红。
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run baseline check
        run: bash scripts/baseline-check.sh
        env:
          # 每次 CI 都实跑，避免残留缓存文件导致误跳过
          BASELINE_NO_CACHE: "1"
